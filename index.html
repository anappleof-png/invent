<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>꿈나무 발명 펀딩소</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF6FF;
    --bg-dot:#D7ECFB;
    --card:#FFFFFF;
    --primary:#43B36B;
    --primary-dark:#2E8B52;
    --secondary:#FFC93C;
    --secondary-dark:#F0A800;
    --accent:#FF6F59;
    --accent-dark:#E5553F;
    --text:#28344E;
    --text-soft:#63719086;
    --text-soft2:#5C6B8A;
    --border:#D8E9F5;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow:0 10px 24px rgba(40,52,78,0.10);
    --shadow-soft:0 4px 12px rgba(40,52,78,0.08);
    --font-display:'Jua', sans-serif;
    --font-hand:'Gaegu', sans-serif;
    --font-body:'Noto Sans KR', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:
      radial-gradient(var(--bg-dot) 2px, transparent 2px) 0 0/26px 26px,
      var(--bg);
    font-family:var(--font-body);
    color:var(--text);
    min-height:100vh;
  }
  h1,h2,h3,button{font-family:var(--font-display);}
  button{cursor:pointer; border:none; font-family:var(--font-display);}
  input,textarea{font-family:var(--font-body);}
  .hidden{display:none !important;}

  /* ===== Header ===== */
  .site-header{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:14px 22px;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(6px);
    border-bottom:3px dashed var(--primary);
  }
  .logo{display:flex; align-items:center; gap:10px;}
  .logo .sprout{font-size:34px; filter:drop-shadow(0 3px 0 rgba(0,0,0,0.08));}
  .logo h1{margin:0; font-size:24px; color:var(--primary-dark); letter-spacing:0.5px;}
  .logo p{margin:0; font-family:var(--font-hand); font-size:13px; color:var(--text-soft2); font-weight:700;}
  .user-pill{
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(135deg,#FFF7DC,#FFEFC2);
    border:2px solid var(--secondary-dark);
    border-radius:999px; padding:8px 16px;
    font-family:var(--font-display); font-size:14px; color:var(--text);
    white-space:nowrap;
  }
  .user-pill b{color:var(--primary-dark);}
  .user-pill .coin{font-size:16px;}

  /* ===== Intro banner ===== */
  .intro{
    max-width:960px; margin:22px auto 6px; padding:0 20px;
    text-align:center;
  }
  .intro h2{
    font-family:var(--font-hand); font-weight:700; font-size:22px;
    color:var(--primary-dark); margin:0 0 4px;
  }
  .intro p{margin:0; color:var(--text-soft2); font-size:14px;}

  main{max-width:1100px; margin:0 auto; padding:18px 20px 120px;}

  /* ===== Board grid ===== */
  .board-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:22px; margin-top:18px;
  }
  .empty-state{
    grid-column:1/-1; text-align:center; padding:60px 20px;
    color:var(--text-soft2); font-family:var(--font-hand); font-size:18px;
  }

  /* ===== Card ===== */
  .post-card{
    background:var(--card); border-radius:var(--radius-lg);
    box-shadow:var(--shadow); border:2px solid var(--border);
    overflow:hidden; display:flex; flex-direction:column;
    position:relative; transition:transform .15s ease;
  }
  .post-card:hover{transform:translateY(-3px);}
  .post-card.success{border-color:var(--secondary-dark);}
  .success-badge{
    position:absolute; top:12px; right:-34px; transform:rotate(35deg);
    background:var(--accent); color:#fff; font-size:12px; font-family:var(--font-display);
    padding:5px 40px; box-shadow:0 3px 6px rgba(0,0,0,0.15); z-index:2;
  }
  .card-img{
    width:100%; height:170px; object-fit:cover; background:#F1F6FB;
    border-bottom:3px solid var(--border);
  }
  .card-img.placeholder{
    display:flex; align-items:center; justify-content:center;
    font-size:48px; color:#B9CEE0;
  }
  .card-body{padding:16px 18px 18px; display:flex; flex-direction:column; gap:10px; flex:1;}
  .card-title{margin:0; font-size:19px; color:var(--text); line-height:1.3;}
  .author-badge{
    align-self:flex-start;
    font-family:var(--font-hand); font-weight:700; font-size:13px;
    background:#EFF8F0; color:var(--primary-dark);
    border-radius:999px; padding:3px 12px;
  }
  .card-desc{font-size:14px; color:var(--text-soft2); line-height:1.55; margin:0; white-space:pre-wrap;}
  .perks-box{
    background:#FFFBEA; border:1.5px dashed var(--secondary-dark);
    border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; color:#6B5300;
    white-space:pre-wrap; line-height:1.5;
  }
  .perks-box b{font-family:var(--font-display); color:#8A6A00;}

  /* growth progress */
  .grow-row{display:flex; align-items:center; gap:10px;}
  .grow-emoji{font-size:30px; line-height:1;}
  .grow-track{
    flex:1; height:16px; background:#EAF1F8; border-radius:999px; overflow:hidden;
    border:2px solid var(--border);
  }
  .grow-fill{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--primary), var(--secondary));
    transition:width .4s ease;
  }
  .grow-stats{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-soft2); font-weight:700;}
  .grow-stats .goal{color:var(--accent-dark);}
  .grow-label{font-family:var(--font-hand); font-size:13px; color:var(--primary-dark); font-weight:700;}

  /* funding controls */
  .fund-box{
    margin-top:4px; padding-top:12px; border-top:2px dashed var(--border);
    display:flex; flex-direction:column; gap:8px;
  }
  .quick-row{display:flex; gap:6px; flex-wrap:wrap;}
  .quick-btn{
    background:#F1F6FB; color:var(--text-soft2); border:1.5px solid var(--border);
    border-radius:999px; font-size:12px; padding:5px 10px; font-family:var(--font-body); font-weight:700;
  }
  .quick-btn:hover{background:var(--border);}
  .fund-input-row{display:flex; gap:8px;}
  .fund-input{
    flex:1; min-width:0; border:2px solid var(--border); border-radius:var(--radius-sm);
    padding:9px 12px; font-size:14px; outline:none;
  }
  .fund-input:focus{border-color:var(--primary);}
  .fund-btn{
    background:var(--accent); color:#fff; border-radius:var(--radius-sm);
    padding:9px 16px; font-size:14px; box-shadow:0 3px 0 var(--accent-dark);
    transition:transform .08s;
  }
  .fund-btn:hover{transform:translateY(1px); box-shadow:0 2px 0 var(--accent-dark);}
  .fund-btn:disabled{background:#C9D3E0; box-shadow:none; cursor:not-allowed;}
  .own-note{font-size:12px; color:var(--text-soft2); font-family:var(--font-hand); font-weight:700; text-align:center;}

  /* ===== FAB ===== */
  .fab{
    position:fixed; right:26px; bottom:26px; z-index:15;
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, var(--accent), var(--accent-dark));
    color:#fff; font-size:16px; padding:16px 22px; border-radius:999px;
    box-shadow:0 8px 18px rgba(255,111,89,0.45);
    transition:transform .12s;
  }
  .fab:hover{transform:translateY(-2px) scale(1.03);}
  .fab .plus{font-size:20px;}

  /* ===== Modal ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(40,52,78,0.55);
    display:flex; align-items:center; justify-content:center; z-index:50;
    padding:20px;
  }
  .modal-box{
    background:var(--card); border-radius:var(--radius-lg); box-shadow:var(--shadow);
    max-width:460px; width:100%; padding:28px 26px; max-height:88vh; overflow-y:auto;
    border:3px solid var(--primary);
  }
  .modal-box.wide{max-width:560px;}
  .modal-box h2{margin:0 0 6px; font-size:22px; color:var(--primary-dark); text-align:center;}
  .modal-sub{text-align:center; font-family:var(--font-hand); font-weight:700; color:var(--text-soft2); font-size:14px; margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-family:var(--font-display); font-size:14px; color:var(--text); margin-bottom:6px;}
  .field input[type=text], .field input[type=number], .field textarea{
    width:100%; border:2px solid var(--border); border-radius:var(--radius-sm);
    padding:10px 12px; font-size:14px; outline:none; resize:vertical;
  }
  .field input:focus, .field textarea:focus{border-color:var(--primary);}
  .field input[type=file]{
    width:100%; font-size:13px; padding:8px; border:2px dashed var(--border); border-radius:var(--radius-sm);
    background:#F8FBFE;
  }
  .img-preview{
    margin-top:8px; max-width:100%; max-height:150px; border-radius:var(--radius-sm);
    display:none; border:2px solid var(--border);
  }
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .btn-primary{
    flex:1; background:var(--primary); color:#fff; border-radius:var(--radius-sm);
    padding:12px; font-size:16px; box-shadow:0 3px 0 var(--primary-dark);
  }
  .btn-primary:hover{transform:translateY(1px); box-shadow:0 2px 0 var(--primary-dark);}
  .btn-ghost{
    background:#EEF3F8; color:var(--text-soft2); border-radius:var(--radius-sm);
    padding:12px 18px; font-size:15px;
  }
  .name-input{
    width:100%; text-align:center; font-size:20px; padding:14px; border-radius:var(--radius-md);
    border:2.5px solid var(--border); outline:none; font-family:var(--font-display);
  }
  .name-input:focus{border-color:var(--primary);}
  .point-callout{
    text-align:center; margin-top:14px; font-family:var(--font-hand); font-weight:700;
    color:var(--secondary-dark); font-size:15px;
  }

  /* ===== Toast ===== */
  #toast{
    position:fixed; left:50%; bottom:100px; transform:translate(-50%,20px);
    background:var(--text); color:#fff; padding:12px 22px; border-radius:999px;
    font-family:var(--font-display); font-size:14px; z-index:60;
    opacity:0; pointer-events:none; transition:all .25s ease;
    box-shadow:0 6px 16px rgba(0,0,0,0.25); max-width:90vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}

  @media(max-width:520px){
    .site-header{padding:12px 14px;}
    .logo h1{font-size:19px;}
    .logo .sprout{font-size:26px;}
    .fab{right:16px; bottom:16px; padding:14px 18px; font-size:14px;}
  }
</style>
</head>
<body>

  <!-- 이름 입력 팝업 -->
  <div id="nameModal" class="modal-overlay">
    <div class="modal-box">
      <h2>🌱 어서 와요!</h2>
      <p class="modal-sub">꿈나무 발명 펀딩소에 입장할 이름을 알려주세요</p>
      <form id="nameForm">
        <input type="text" id="nameInput" class="name-input" placeholder="이름을 입력해요" maxlength="12" required autocomplete="off">
        <div class="point-callout">✨ 입장하면 100,000 포인트를 바로 받아요!</div>
        <div class="modal-actions">
          <button type="submit" class="btn-primary">🚀 입장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 새 발명품 등록 팝업 -->
  <div id="postModal" class="modal-overlay hidden">
    <div class="modal-box wide">
      <h2>💡 내 발명품 등록하기</h2>
      <p class="modal-sub">친구들에게 내 아이디어를 자랑해봐요!</p>
      <form id="postForm">
        <div class="field">
          <label for="titleInput">🔧 발명품 이름</label>
          <input type="text" id="titleInput" maxlength="30" placeholder="예) 자동으로 접히는 우산" required>
        </div>
        <div class="field">
          <label for="descInput">📝 발명품 설명</label>
          <textarea id="descInput" rows="3" maxlength="300" placeholder="어떤 발명품인지, 어떻게 쓰는지 알려주세요" required></textarea>
        </div>
        <div class="field">
          <label for="goalInput">🎯 펀딩 목표 (포인트)</label>
          <input type="number" id="goalInput" min="1" max="1000000" placeholder="예) 50000" required>
        </div>
        <div class="field">
          <label for="perksInput">🎁 펀딩 참여자 혜택</label>
          <textarea id="perksInput" rows="2" maxlength="200" placeholder="예) 완성되면 제일 먼저 선물로 드려요!" required></textarea>
        </div>
        <div class="field">
          <label for="imgInput">📷 발명품 사진 (선택)</label>
          <input type="file" id="imgInput" accept="image/*">
          <img id="imgPreview" class="img-preview" alt="미리보기">
        </div>
        <div class="modal-actions">
          <button type="button" id="postCancelBtn" class="btn-ghost">취소</button>
          <button type="submit" class="btn-primary">✅ 등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <header class="site-header">
    <div class="logo">
      <span class="sprout">🌱</span>
      <div>
        <h1>꿈나무 발명 펀딩소</h1>
        <p>작은 아이디어가 자라나는 곳</p>
      </div>
    </div>
    <div class="user-pill" id="userPill">
      <span>👋 <b id="userNameLabel">-</b>님</span>
      <span>·</span>
      <span class="coin">💰</span><b id="userPointsLabel">0</b>P
    </div>
  </header>

  <div class="intro">
    <h2>너의 멋진 발명 아이디어에 친구들의 힘을 모아보세요 🚀</h2>
    <p>발명품을 등록하고, 다른 친구들의 발명품엔 포인트로 펀딩해줘요. 펀딩이 쌓일수록 나무가 무럭무럭 자라나요!</p>
  </div>

  <main>
    <div id="board" class="board-grid">
      <div class="empty-state">🌰 게시판을 불러오는 중이에요...</div>
    </div>
  </main>

  <button class="fab" id="newPostBtn"><span class="plus">＋</span> 발명품 등록하기</button>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import {
    getFirestore, collection, doc, setDoc, getDoc, addDoc,
    onSnapshot, query, orderBy, runTransaction, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC-ZUUUpYAzHgpF6y2T5cKUNMp9EGiRCV4",
    authDomain: "kids-invention-funding.firebaseapp.com",
    projectId: "kids-invention-funding",
    storageBucket: "kids-invention-funding.firebasestorage.app",
    messagingSenderId: "118122608313",
    appId: "1:118122608313:web:98060ef16d5cf5a8490d68"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const START_POINTS = 100000;
  const STORAGE_KEY = "kif_userId";

  let currentUser = null; // {id, name, points}
  let latestPosts = [];

  // ---------- utility: toast ----------
  let toastTimer = null;
  function showToast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
  }

  // ---------- header UI ----------
  function updateHeaderUI(){
    if(!currentUser) return;
    document.getElementById("userNameLabel").textContent = currentUser.name;
    document.getElementById("userPointsLabel").textContent = currentUser.points.toLocaleString("ko-KR");
  }

  // ---------- name modal ----------
  const nameModal = document.getElementById("nameModal");
  const nameForm = document.getElementById("nameForm");

  nameForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const nameInput = document.getElementById("nameInput");
    const name = nameInput.value.trim();
    if(!name) return;
    const submitBtn = nameForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;

    try{
      const newRef = doc(collection(db, "users"));
      await setDoc(newRef, { name, points: START_POINTS, createdAt: serverTimestamp() });
      localStorage.setItem(STORAGE_KEY, newRef.id);
      currentUser = { id: newRef.id, name, points: START_POINTS };
      nameModal.classList.add("hidden");
      updateHeaderUI();
      subscribeUser();
      subscribePosts();
      showToast(`${name}님, 환영해요! 100,000P 받았어요 🎉`);
    }catch(err){
      console.error(err);
      showToast("입장에 실패했어요. 다시 시도해주세요!");
      submitBtn.disabled = false;
    }
  });

  async function initUser(){
    const savedId = localStorage.getItem(STORAGE_KEY);
    if(savedId){
      try{
        const snap = await getDoc(doc(db, "users", savedId));
        if(snap.exists()){
          const data = snap.data();
          currentUser = { id: savedId, name: data.name, points: data.points };
          nameModal.classList.add("hidden");
          updateHeaderUI();
          subscribeUser();
          subscribePosts();
          return;
        }
      }catch(err){ console.error(err); }
    }
    nameModal.classList.remove("hidden");
    document.getElementById("nameInput").focus();
  }

  function subscribeUser(){
    onSnapshot(doc(db, "users", currentUser.id), (snap)=>{
      if(!snap.exists()) return;
      const data = snap.data();
      currentUser.points = data.points;
      currentUser.name = data.name;
      updateHeaderUI();
      renderBoard(); // refresh funding buttons (own-post checks, disabled states)
    });
  }

  // ---------- post modal ----------
  const postModal = document.getElementById("postModal");
  const postForm = document.getElementById("postForm");
  const newPostBtn = document.getElementById("newPostBtn");
  const postCancelBtn = document.getElementById("postCancelBtn");
  const imgInput = document.getElementById("imgInput");
  const imgPreview = document.getElementById("imgPreview");
  let pendingImageData = "";

  newPostBtn.addEventListener("click", ()=>{
    postModal.classList.remove("hidden");
  });
  postCancelBtn.addEventListener("click", ()=>{
    postModal.classList.add("hidden");
    postForm.reset();
    pendingImageData = "";
    imgPreview.style.display = "none";
  });

  imgInput.addEventListener("change", ()=>{
    const file = imgInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        pendingImageData = canvas.toDataURL("image/jpeg", 0.72);
        imgPreview.src = pendingImageData;
        imgPreview.style.display = "block";
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  postForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const title = document.getElementById("titleInput").value.trim();
    const description = document.getElementById("descInput").value.trim();
    const goal = Number(document.getElementById("goalInput").value);
    const perks = document.getElementById("perksInput").value.trim();
    if(!title || !description || !perks || !goal || goal <= 0) return;

    const submitBtn = postForm.querySelector("button[type=submit]");
    submitBtn.disabled = true;
    try{
      await addDoc(collection(db, "posts"), {
        authorId: currentUser.id,
        authorName: currentUser.name,
        title, description, perks,
        goal, funded: 0,
        imageData: pendingImageData || "",
        createdAt: serverTimestamp()
      });
      postModal.classList.add("hidden");
      postForm.reset();
      pendingImageData = "";
      imgPreview.style.display = "none";
      showToast("발명품이 등록되었어요! 🌱");
    }catch(err){
      console.error(err);
      showToast("등록에 실패했어요. 다시 시도해주세요!");
    }finally{
      submitBtn.disabled = false;
    }
  });

  // ---------- posts feed ----------
  function subscribePosts(){
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snap)=>{
      latestPosts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderBoard();
    });
  }

  function growthStage(percent){
    if(percent >= 100) return { emoji:"🎉", label:"펀딩 성공! 다 자랐어요" };
    if(percent >= 75)  return { emoji:"🌳", label:"무럭무럭 자라는 중" };
    if(percent >= 50)  return { emoji:"🌿", label:"쑥쑥 크는 중" };
    if(percent >= 25)  return { emoji:"🌱", label:"새싹이 났어요" };
    return { emoji:"🌰", label:"씨앗 단계" };
  }

  function renderBoard(){
    const board = document.getElementById("board");
    board.innerHTML = "";

    if(latestPosts.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "🌰 아직 등록된 발명품이 없어요! 첫 번째 발명가가 되어보세요";
      board.appendChild(empty);
      return;
    }

    latestPosts.forEach(post => board.appendChild(buildCard(post)));
  }

  function buildCard(post){
    const goal = Number(post.goal) || 0;
    const funded = Number(post.funded) || 0;
    const percent = goal > 0 ? Math.min(100, Math.round((funded / goal) * 100)) : 0;
    const stage = growthStage(percent);
    const isOwner = currentUser && post.authorId === currentUser.id;
    const isDone = percent >= 100;

    const card = document.createElement("div");
    card.className = "post-card" + (isDone ? " success" : "");

    if(isDone){
      const badge = document.createElement("div");
      badge.className = "success-badge";
      badge.textContent = "달성!";
      card.appendChild(badge);
    }

    if(post.imageData){
      const img = document.createElement("img");
      img.className = "card-img";
      img.src = post.imageData;
      img.alt = post.title || "발명품 사진";
      card.appendChild(img);
    }else{
      const ph = document.createElement("div");
      ph.className = "card-img placeholder";
      ph.textContent = "💡";
      card.appendChild(ph);
    }

    const body = document.createElement("div");
    body.className = "card-body";

    const authorBadge = document.createElement("span");
    authorBadge.className = "author-badge";
    authorBadge.textContent = "만든 사람: " + (post.authorName || "이름없음");
    body.appendChild(authorBadge);

    const title = document.createElement("h3");
    title.className = "card-title";
    title.textContent = post.title || "";
    body.appendChild(title);

    const desc = document.createElement("p");
    desc.className = "card-desc";
    desc.textContent = post.description || "";
    body.appendChild(desc);

    const perksBox = document.createElement("div");
    perksBox.className = "perks-box";
    const perksLabel = document.createElement("b");
    perksLabel.textContent = "🎁 펀딩 혜택 ";
    perksBox.appendChild(perksLabel);
    perksBox.appendChild(document.createElement("br"));
    perksBox.appendChild(document.createTextNode(post.perks || ""));
    body.appendChild(perksBox);

    const growLabel = document.createElement("div");
    growLabel.className = "grow-label";
    growLabel.textContent = stage.label;
    body.appendChild(growLabel);

    const growRow = document.createElement("div");
    growRow.className = "grow-row";
    const growEmoji = document.createElement("span");
    growEmoji.className = "grow-emoji";
    growEmoji.textContent = stage.emoji;
    const track = document.createElement("div");
    track.className = "grow-track";
    const fill = document.createElement("div");
    fill.className = "grow-fill";
    fill.style.width = percent + "%";
    track.appendChild(fill);
    growRow.appendChild(growEmoji);
    growRow.appendChild(track);
    body.appendChild(growRow);

    const stats = document.createElement("div");
    stats.className = "grow-stats";
    const cur = document.createElement("span");
    cur.textContent = funded.toLocaleString("ko-KR") + "P 모임 (" + percent + "%)";
    const goalSpan = document.createElement("span");
    goalSpan.className = "goal";
    goalSpan.textContent = "목표 " + goal.toLocaleString("ko-KR") + "P";
    stats.appendChild(cur);
    stats.appendChild(goalSpan);
    body.appendChild(stats);

    const fundBox = document.createElement("div");
    fundBox.className = "fund-box";

    if(isOwner){
      const note = document.createElement("div");
      note.className = "own-note";
      note.textContent = "🙂 내가 등록한 발명품이에요";
      fundBox.appendChild(note);
    }else if(isDone){
      const note = document.createElement("div");
      note.className = "own-note";
      note.textContent = "🎉 이미 목표를 달성했어요!";
      fundBox.appendChild(note);
    }else{
      const quickRow = document.createElement("div");
      quickRow.className = "quick-row";
      const fundInput = document.createElement("input");
      fundInput.type = "number";
      fundInput.className = "fund-input";
      fundInput.min = "1";
      fundInput.placeholder = "펀딩할 포인트";

      [1000, 5000, 10000, 30000].forEach(amt => {
        const qb = document.createElement("button");
        qb.type = "button";
        qb.className = "quick-btn";
        qb.textContent = amt.toLocaleString("ko-KR") + "P";
        qb.addEventListener("click", ()=>{ fundInput.value = amt; });
        quickRow.appendChild(qb);
      });
      fundBox.appendChild(quickRow);

      const inputRow = document.createElement("div");
      inputRow.className = "fund-input-row";
      inputRow.appendChild(fundInput);

      const fundBtn = document.createElement("button");
      fundBtn.type = "button";
      fundBtn.className = "fund-btn";
      fundBtn.textContent = "펀딩하기 🚀";
      fundBtn.addEventListener("click", ()=> handleFund(post.id, fundInput, fundBtn));
      inputRow.appendChild(fundBtn);

      fundBox.appendChild(inputRow);
    }

    body.appendChild(fundBox);
    card.appendChild(body);
    return card;
  }

  async function handleFund(postId, fundInput, fundBtn){
    const amount = parseInt(fundInput.value, 10);
    if(!amount || amount <= 0){
      showToast("포인트를 올바르게 입력해주세요!");
      return;
    }
    fundBtn.disabled = true;
    try{
      let finalAmount = 0;
      let failMsg = "";
      await runTransaction(db, async (tx)=>{
        const userRef = doc(db, "users", currentUser.id);
        const postRef = doc(db, "posts", postId);
        const userSnap = await tx.get(userRef);
        const postSnap = await tx.get(postRef);
        if(!userSnap.exists() || !postSnap.exists()){
          failMsg = "정보를 찾을 수 없어요!";
          return;
        }
        const userData = userSnap.data();
        const postData = postSnap.data();

        if(postData.authorId === currentUser.id){
          failMsg = "내가 만든 발명품에는 펀딩할 수 없어요!";
          return;
        }
        const remaining = Math.max((postData.goal || 0) - (postData.funded || 0), 0);
        if(remaining <= 0){
          failMsg = "이미 목표를 달성했어요! 🎉";
          return;
        }
        if((userData.points || 0) <= 0){
          failMsg = "포인트가 부족해요!";
          return;
        }
        finalAmount = Math.min(amount, userData.points, remaining);
        if(finalAmount <= 0){
          failMsg = "포인트가 부족해요!";
          return;
        }
        tx.update(userRef, { points: userData.points - finalAmount });
        tx.update(postRef, { funded: (postData.funded || 0) + finalAmount });
      });

      if(failMsg){
        showToast(failMsg);
      }else{
        showToast(finalAmount.toLocaleString("ko-KR") + "P 펀딩 완료! 🌱");
        fundInput.value = "";
      }
    }catch(err){
      console.error(err);
      showToast("펀딩 중 문제가 생겼어요. 다시 시도해주세요!");
    }finally{
      fundBtn.disabled = false;
    }
  }

  // ---------- start ----------
  initUser();
</script>
</body>
</html>
